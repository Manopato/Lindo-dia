<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¿Armamos los muñequitos?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #000000, #1a1a1a);
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
      font-size: 20px;
    }

    .title {
      margin-top: 30px;
      font-size: 2.2em;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }

    .buttons {
      margin-top: 40px;
    }

    button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 15px 30px;
      margin: 10px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 0 10px #00ffcc;
    }

    #dateInput {
      margin-top: 20px;
      display: none;
    }

    input[type="date"] {
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 1em;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <div class="title">¿Armamos los muñequitos?</div>

  <div class="buttons">
    <button onclick="mostrarFecha()">Sí</button>
    <button onclick="alert('¡Otra vez será!')">No</button>
  </div>

  <div id="dateInput">
    <p>Elige una fecha:</p>
    <input type="date" id="fecha">
    <br>
    <a id="whatsappLink" href="#" target="_blank">Enviar por WhatsApp</a>
  </div>

  <script>
    function mostrarFecha() {
      document.getElementById('dateInput').style.display = 'block';
      const fechaInput = document.getElementById('fecha');
      const link = document.getElementById('whatsappLink');
      fechaInput.addEventListener('change', () => {
        const fecha = fechaInput.value;
        const mensaje = `¡Hola! Elegí esta fecha para armar los muñequitos: ${fecha}`;
        link.href = `https://wa.me/573017004532?text=${encodeURIComponent(mensaje)}`;
      });
    }
  </script>
</body>
</html>
