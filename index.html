<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¿Armamos los muñequitos?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(45deg, #ff0066, #00ccff, #6600ff, #ffcc00);
      background-size: 600% 600%;
      animation: gradient 10s ease infinite;
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
      font-size: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title {
      font-size: 3em;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 15px #000;
      margin-bottom: 40px;
    }

    .buttons {
      position: relative;
    }

    button {
      background-color: #00ffcc;
      color: #000;
      border: none;
      padding: 20px 40px;
      margin: 10px;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ffcc;
      transition: all 0.3s ease;
    }

    #dateInput {
      margin-top: 30px;
      display: none;
    }

    input[type="date"] {
      padding: 12px;
      border-radius: 6px;
      border: none;
      font-size: 1.2em;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1.2em;
      box-shadow: 0 0 10px #25D366;
    }

    .no-button {
      position: absolute;
    }
  </style>
</head>
<body>
  <div class="title">¿Armamos los muñequitos?</div>

  <div class="buttons">
    <button onclick="mostrarFecha()">Sí</button>
    <button class="no-button" id="noBtn" onclick="moverBoton()">No</button>
  </div>

  <div id="dateInput">
    <p>Elige una fecha:</p>
    <input type="date" id="fecha">
    <br>
    <a id="whatsappLink" href="#" target="_blank">Enviar por WhatsApp</a>
  </div>

  <script>
    function mostrarFecha() {
      document.getElementById('dateInput').style.display = 'block';
      const fechaInput = document.getElementById('fecha');
      const link = document.getElementById('whatsappLink');
      fechaInput.addEventListener('change', () => {
        const fecha = fechaInput.value;
        const mensaje = `¡Hola! Elegí esta fecha para armar los muñequitos: ${fecha}`;
        link.href = `https://wa.me/573017004532?text=${encodeURIComponent(mensaje)}`;
      });
    }

    function moverBoton() {
      const btn = document.getElementById('noBtn');
      const x = Math.floor(Math.random() * 80); // hasta 80% del ancho
      const y = Math.floor(Math.random() * 60); // hasta 60% del alto
      btn.style.left = `${x}%`;
      btn.style.top = `${y}%`;
      alert('¡Otra vez será!');
    }
  </script>
</body>
</html>
