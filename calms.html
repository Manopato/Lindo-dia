<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¿Cuándo armamos los muñequitos?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #000000, #1a1a1a);
      font-family: 'Arial', sans-serif;
      color: #fff;
      text-align: center;
    }

    .title {
      margin-top: 30px;
      font-size: 2em;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
    }

    .image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin: 40px 20px;
    }

    .image-container img {
      width: 80%;
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      opacity: 0;
      animation: fadeIn 2s ease-in-out forwards;
    }

    .image-container img:nth-child(2) {
      animation-delay: 1s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="title">¿Cuándo armamos los muñequitos?</div>

  <div class="image-container">
    <!-- Imagen de Sanji -->
    <img src="https://i.imgur.com/3dXt13M.jpg" alt="Sanji de One Piece">

    <!-- Imagen animada de Deadpool -->
    <img src="https://media.giphy.com/media/l0MYEqEzwMWFCg8rm/giphy.gif" alt="Deadpool animado">
  </div>
</body>
</html>
