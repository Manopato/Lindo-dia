<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lindo Día - Sanji</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('https://i0.wp.com/ovicio.com.br/wp-content/uploads/2022/11/20221109-sanji-onepiece.jpg?resize=555%2C555&ssl=1');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-shadow: 2px 2px 8px #000;
      font-family: sans-serif;
    }

    .heart {
      font-size: 150px;
      color: red;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 50px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="heart">❤️</div>
  <h1>Ten un lindo día</h1>
</body>
</html>
